<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="sportup-bg" x1="64" y1="32" x2="448" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22C55E"/>
      <stop offset="55%" stop-color="#16A34A"/>
      <stop offset="100%" stop-color="#15803D"/>
    </linearGradient>
    <linearGradient id="trophy-gold" x1="170" y1="110" x2="342" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="45%" stop-color="#FACC15"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="trophy-rim" x1="256" y1="104" x2="256" y2="152" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FEF08A"/>
    </linearGradient>
  </defs>

  <!-- Squircle Base -->
  <rect width="512" height="512" rx="116" fill="url(#sportup-bg)"/>
  <rect x="14" y="14" width="484" height="484" rx="102" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="6"/>

  <!-- Subtle Arena Glow Ring -->
  <circle cx="256" cy="256" r="182" fill="#FFFFFF" fill-opacity="0.11"/>

  <!-- Left & Right Trophy Handles -->
  <path
    d="M168 152H122C106 152 96 164 98 182C102 224 132 258 176 268"
    stroke="#FEF08A"
    stroke-width="24"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <path
    d="M344 152H390C406 152 416 164 414 182C410 224 380 258 336 268"
    stroke="#F59E0B"
    stroke-width="24"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Trophy Pedestal Base -->
  <rect x="170" y="384" width="172" height="34" rx="14" fill="#FFFFFF"/>
  <rect x="192" y="352" width="128" height="36" rx="10" fill="#FACC15"/>

  <!-- Trophy Stem -->
  <path d="M232 296H280L292 356H220L232 296Z" fill="#F59E0B"/>
  <rect x="218" y="330" width="76" height="14" rx="7" fill="#FEF08A"/>

  <!-- Trophy Cup Bowl -->
  <path
    d="M162 122C162 114 168 108 176 108H336C344 108 350 114 350 122V198C350 258 308 308 256 312C204 308 162 258 162 198V122Z"
    fill="url(#trophy-gold)"
    stroke="#FFFFFF"
    stroke-width="10"
    stroke-linejoin="round"
  />

  <!-- Cup Top Rim Highlight -->
  <rect x="150" y="102" width="212" height="24" rx="12" fill="url(#trophy-rim)"/>

  <!-- Champion Star Emblem on Trophy -->
  <path
    d="M256 156L271 188L306 193L280 217L287 252L256 235L225 252L232 217L206 193L241 188L256 156Z"
